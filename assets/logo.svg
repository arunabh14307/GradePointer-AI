<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="gpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield / Hexagon -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#gpGrad)" filter="url(#gpGlow)" opacity="0.15" />
  <rect x="10" y="10" width="80" height="80" rx="22" stroke="url(#gpGrad)" stroke-width="2.5" fill="#0F172A" />
  <!-- Graduation Mortarboard & Compass Pilot Wings -->
  <!-- Mortarboard Diamond Top -->
  <polygon points="50,26 78,38 50,50 22,38" fill="url(#gpGrad)" />
  <!-- Mortarboard Cap Base -->
  <path d="M32 44 V54 C32 60, 68 60, 68 54 V44" stroke="#818CF8" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Tassel -->
  <path d="M72 40 C75 46, 75 56, 73 60" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="73" cy="61" r="2" fill="#F59E0B" />
  <!-- Pilot Flight Vector / Chevron Navigation -->
  <path d="M30 68 L50 56 L70 68" stroke="url(#gpGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M38 76 L50 68 L62 76" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Star AI Indicator -->
  <circle cx="50" cy="40" r="3" fill="#FFFFFF" />
</svg>
